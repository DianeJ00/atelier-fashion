name: ATELIER daily source freshness guard

on:
  workflow_dispatch:
  schedule:
    # Daily 17:00 KST; allow delayed GitHub schedule runs to finish before alarm.
    - cron: '0 8 * * *'

permissions:
  contents: read
  actions: read

jobs:
  verify-daily-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate official data and the actual scheduled workflow result
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/check_daily_freshness.py --verify-schedule
