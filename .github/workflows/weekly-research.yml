name: ATELIER weekly research and site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every Monday at 09:00 Korea Standard Time (UTC+9)
    - cron: '0 0 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atelier-pages
  cancel-in-progress: false

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover public RSS and optional YouTube API titles
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/collect_weekly.py
      - name: Verify Python source syntax
        run: python -m py_compile scripts/collect_weekly.py scripts/collect_official.py scripts/collect_consumer.py scripts/build_weekly_brief.py scripts/build_content_brief.py scripts/collect_market_relative.py
      - name: Test accounting-period alignment and source provenance
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify SEC filings and extract quarterly GAAP facts
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/collect_official.py
      - name: Aggregate public YouTube comment themes when permitted
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/collect_consumer.py
      - name: Collect benchmark-relative ETF performance if display-licensed
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          MARKET_DATA_DISPLAY_OK: ${{ vars.MARKET_DATA_DISPLAY_OK }}
        run: python scripts/collect_market_relative.py
      - name: Summarize eligible full article bodies only
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python scripts/build_content_brief.py
      - name: Build evidence-tiered weekly investment checklist
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        run: python scripts/build_weekly_brief.py
      - name: Save weekly source inbox in repository
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Rebase our generated JSON on the latest main to avoid stale workflow checkouts.
          git fetch origin main
          git reset --mixed origin/main
          git add weekly-research.json official-financials.json consumer-samples.json weekly-investment.json weekly-content.json market-relative.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh weekly fashion source inbox'
            git push origin HEAD:main
          fi
          # Publish current files rather than the snapshot from workflow start.
          git fetch origin main
          git reset --hard origin/main
      - name: Prepare published files only
        run: |
          mkdir -p _site
          cp index.html research2.js research2.css research-universe.json research-pipeline.json weekly-research.json market-relative.json _site/
          for source in official-financials.json consumer-samples.json weekly-investment.json weekly-content.json; do
            if [ -f "$source" ]; then cp "$source" _site/; fi
          done
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: collect-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish ATELIER site
        id: deployment
        uses: actions/deploy-pages@v4
