name: ATELIER daily data refresh and weekly brief

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily 09:00 Korea Standard Time (00:00 UTC). GitHub may start scheduled runs late.
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atelier-pages
  cancel-in-progress: false

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    outputs:
      verified_sha: ${{ steps.snapshot.outputs.sha }}
    steps:
      - name: Check out site source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover public RSS and optional YouTube API titles
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/collect_weekly.py
      - name: Verify Python source syntax
        run: python -m py_compile scripts/collect_weekly.py scripts/collect_official.py scripts/collect_consumer.py scripts/build_weekly_brief.py scripts/build_content_brief.py scripts/collect_market_relative.py scripts/collect_clinical_trials.py scripts/collect_stock_relative.py scripts/collect_consumer_official.py scripts/build_sec_trends.py scripts/build_atelier_weekly.py scripts/build_pipeline_review.py scripts/collect_biotech_official.py scripts/build_data_health.py scripts/collect_korea_dart.py scripts/check_daily_freshness.py scripts/validate_release.py scripts/prepare_site.py scripts/sec_client.py scripts/source_retention.py scripts/revision_guard.py
      - name: Set up Node.js for UI smoke tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test multi-sector UI interactions
        run: |
          node --check legacy-fashion-data.js
          node --check legacy-fashion.js
          node tests/smoke_legacy_archive.cjs
          node tests/smoke_private_backup.cjs
          node tests/smoke_lazy_load.cjs
          node tests/smoke_data_core.cjs
          node tests/smoke_research2.cjs
          node tests/smoke_research3.cjs
          node tests/smoke_navigation25.cjs
          node tests/smoke_market26.cjs
      - name: Test accounting-period alignment, market data and freshness auditing
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify SEC filings and extract quarterly GAAP facts
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/collect_official.py
      - name: Verify official operating KPIs for 15 US consumer and services companies
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/collect_consumer_official.py
      - name: Verify official 10-Q US-GAAP statements for twenty biotech firms
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/collect_biotech_official.py
      - name: Compare US SEC GAAP quarters on identical accounting concepts
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/build_sec_trends.py
      - name: Aggregate public YouTube comment themes when permitted
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/collect_consumer.py
      - name: Collect benchmark-relative ETF performance if display-licensed
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          MARKET_DATA_DISPLAY_OK: ${{ vars.MARKET_DATA_DISPLAY_OK }}
        run: python scripts/collect_market_relative.py
      - name: Match official clinical studies to tracked drugs and registrants
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        run: python scripts/collect_clinical_trials.py
      - name: Match twelve biotech watchlist assets with verified registry study stages
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        run: python scripts/build_pipeline_review.py
      - name: Calculate per-stock relative returns in controlled API batches
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          MARKET_DATA_DISPLAY_OK: ${{ vars.MARKET_DATA_DISPLAY_OK }}
          STOCK_MAX_SYMBOLS: '47'
          STOCK_API_SLEEP_SEC: '9.0'
        run: python scripts/collect_stock_relative.py
      - name: Summarize eligible full article bodies only
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python scripts/build_content_brief.py
      - name: Build evidence-tiered weekly investment checklist
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        run: python scripts/build_weekly_brief.py
      - name: Build integrated cross-sector weekly brief and analyst review queue
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        run: python scripts/build_atelier_weekly.py
      - name: Read five Korean issuer regular filings from OpenDART if authorized
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/collect_korea_dart.py
      - name: Audit verified data coverage and unfinished source connections
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        run: python scripts/build_data_health.py
      - name: Validate newly collected datasets and sign immutable release
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        run: python scripts/validate_release.py build
      - name: Save daily-checked source data in repository
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research refresh]')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Verified data is valid only for the exact source revision tested above.
          # If main changed during collection, fail closed: do not reset or rebase.
          python scripts/revision_guard.py
          git add weekly-research.json official-financials.json consumer-samples.json weekly-investment.json weekly-content.json consumer-official.json biotech-financials.json sec-trends.json atelier-weekly.json market-relative.json clinical-trials.json research-pipeline.json stock-relative.json korea-dart.json data-health.json data-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh daily source verification'
            git push origin HEAD:main
          fi
          # Confirm no other main update overtook our now-tested commit.
          python scripts/revision_guard.py
      - name: Record exact validated repository revision
        id: snapshot
        run: |
          python scripts/revision_guard.py
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate-and-package:
    needs: collect-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the committed, validated release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.collect-and-build.outputs.verified_sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify complete source dataset against release manifest
        run: python scripts/validate_release.py check
      - name: Prepare immutable release and Pages site
        run: python scripts/prepare_site.py
      - name: Validate packaged Pages site before upload
        run: python scripts/validate_release.py verify-site _site
      - name: Reject obsolete release if main changed during packaging
        run: python scripts/revision_guard.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: [collect-and-build, validate-and-package]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out exactly the validated release to be deployed
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.collect-and-build.outputs.verified_sha }}
      - name: Reject obsolete release before Pages publish
        run: python3 scripts/revision_guard.py
      - name: Publish ATELIER site
        id: deployment
        uses: actions/deploy-pages@v4
