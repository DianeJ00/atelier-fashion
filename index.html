<style>
/* ATELIER light research theme · 2026-11-04
   Accessible white surface / indigo-blue identity / legible financial tables.
   Overrides the original dark terminal skin without changing any data or behavior. */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --panel: #ffffff;
  --panel2: #f4f8fe;
  --raised: #edf4fd;
  --line: #dbe5f0;
  --text: #142a44;
  --muted: #586c83;
  --teal: #1a5eb1;
  --tealDim: #e4f0ff;
  --red: #be3545;
  --gold: #92610e;
  --blue: #215fb6;
  --violet: #7056b0;
  --shadow: 0 2px 12px rgba(25, 61, 109, .05);
  --primary: #245fb3;
  --primaryHover: #174a92;
  --primaryTint: #eaf3ff;
  --ink: #152c48;
}
body { background:#fff; color:var(--ink); font-size:14px; line-height:1.6; }
button,input,select,textarea { color:var(--ink); }
a { color:#1557ac; }
::selection {background:#d0e4ff;color:#173b71}
:focus-visible {outline:3px solid #85b6f8;outline-offset:2px}

/* Navigation: light and quietly separated from dense financial material. */
.sidebar {width:244px;background:#f8fbff;border-right:1px solid #dce7f4;padding:26px 16px 20px}
.identity{padding:0 9px 30px;gap:10px}
.ident-icon{background:var(--primary);color:#fff;box-shadow:0 3px 11px #184b8f26}
.ident-icon span{color:#aadaff}
.identity strong{color:#16355d}
.identity small{color:#667f99;font-size:9px}
.nav-eyebrow{color:#7a8fa7;font-weight:600}
.nav-item{color:#52677f;font-size:12px;padding:11px 12px;border:1px solid transparent}
.nav-item:hover{background:#e8f1ff;color:#1759a7}
.nav-item.active{background:#dcecff;color:#154c97;border-color:#bcd7fa;font-weight:800}
.ni{color:#6a8db6}
.nav-item.active .ni{color:#1a5fb6}
.sidebar-bottom{border-top:1px solid #d8e5f2}
.data-icon{color:#235eaa}
.sidebar-tiny{color:#6f839b}

/* Header, typography and page rhythm */
.topbar{background:#fffffff2;border-bottom:1px solid #dce7f2;box-shadow:0 1px 6px #17427908}
.crumb{color:#567089;font-weight:700}
.crumb-sep{color:#9bb0c2}
.top-datum{color:#526981}
.live-dot{background:#dc9a38;box-shadow:0 0 0 4px #fff0d6}
.icon-btn,.mobile-menu{background:#f7faff;border-color:#d2e0f0;color:#225fae}
.icon-btn:hover,.mobile-menu:hover{background:#e8f2ff}
.top-export,.btn{background:#2563b8;border:1px solid #2563b8;color:#fff;border-radius:8px;font-weight:700}
.top-export:hover,.btn:hover{background:#164d99;border-color:#164d99}
.btn-ghost{background:#fff;border:1px solid #cbdcf0;color:#245ba8}
.btn-ghost:hover{background:#edf5ff}
.content{padding-top:30px}
.eyebrow{color:#2362af;font-weight:800}
.section-head h1{color:#16314f;font-size:30px;letter-spacing:-1.2px}
.lead{color:#526981;font-size:13px;max-width:940px}
.small-meta{color:#627991}
.section-separator h2{color:#1a385b;font-size:17px}
.link-btn{color:#1a60b0;font-weight:700;font-size:12px}
.card-title{color:#173453;font-size:14px}
.card-desc{color:#596f85;font-size:12px}
.small{font-size:12px}
.micro{font-size:11px}
.subtle{color:#61758c}
.footer-note{color:#70839a}

/* Cards and prominent overview */
.card{background:#fff;border:1px solid #dce6f1;box-shadow:0 3px 16px #1b51870b;border-radius:12px}
.card-soft{background:#f6faff}
.kpi-card{border-top:3px solid #286bc0}
.kpi-head{color:#536b84}
.kpi-num{color:#16395f}
.kpi-foot{color:#647c93}
.hero{background:linear-gradient(118deg,#eaf3ff 0%,#f5f9ff 51%,#e9f1ff 100%);border:1px solid #bfd7f5;min-height:173px}
.hero:after{color:#1a5aab0b}
.hero-title{color:#17385c;font-size:29px}
.hero p{color:#4d6780;font-size:13px}
.hero .eyebrow{color:#1f64b6}
.hero-stat{background:#fff;border:1px solid #cddff4;box-shadow:0 2px 5px #184f8607}
.hero-stat b{color:#173859}
.hero-stat span{color:#64798e;font-size:11px}
.focus-card{border-left:3px solid #3b79c5;min-height:176px;background:#fff}
.focus-card:hover{background:#f5f9ff;border-color:#95bee9;transform:translateY(-1px);box-shadow:0 7px 20px #1a5ca016}
.focus-card .ticker{color:#234d7a}
.focus-price{color:#102d4b;font-size:24px}
.focus-bottom{color:#4e657c;font-size:12px;line-height:1.5}
.metric-row{gap:10px}

<style id="atelier-research-desk-style">

/* ATELIER Research Desk — single visual system. Source modules stay intact. */
:root{
  --desk-bg:#f5f6f3;--desk-paper:#fff;--desk-ink:#17292e;

  font-size:14px;line-height:1.55}
.shell{display:block;min-height:100vh;background:var(--desk-bg)}
.main-shell{min-height:100vh;background:transparent}
